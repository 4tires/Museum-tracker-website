<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Museum Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a href="{{ url_for('museums.index') }}">Museum Tracker</a>
    {# TODO: nav links, login/logout depending on current_user #}
  </header>

  <main>
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}<p class="flash">{{ message }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
