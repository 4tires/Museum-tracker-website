<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Museum Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
    <a href="{{ url_for('museums.index') }}">Home</a>
    <a href="{{ url_for('museums.museums') }}">Museums</a>
    {% if current_user.is_authenticated %}
      {% if current_user.has_role('admin') %}
        <a href="{{ url_for('admin.index') }}">Admin</a>
      {% endif %}
      <form action="{{ url_for('security.logout') }}" method="post" class="logout-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Logout</button>
      </form>
    {% else %}
      <a href="{{ url_for('security.login') }}">Login</a>
      <a href="{{ url_for('security.register') }}">Register</a>
    {% endif %}
  </header>

  <main>
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}<p class="flash">{{ message }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='notes.js') }}"></script>
</body>
</html>
